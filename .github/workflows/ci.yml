name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kabin
          POSTGRES_USER: kabin
          POSTGRES_PASSWORD: kabin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kabin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-key
      DJANGO_DEBUG: "true"
      POSTGRES_DB: kabin
      POSTGRES_USER: kabin
      POSTGRES_PASSWORD: kabin
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (format + analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Dart format check
        run: dart format --set-exit-if-changed .
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test
