name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (format + analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Dart format check
        run: dart format --set-exit-if-changed .
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test